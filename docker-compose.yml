services:
  db:
    image: postgres:16-alpine
    container_name: leadfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadfinder
      POSTGRES_PASSWORD: leadfinder
      POSTGRES_DB: leadfinder
    ports:
      - "5432:5432"
    volumes:
      - leadfinder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadfinder -d leadfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leadfinder-pgdata:
